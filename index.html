<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245e48">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>eBird 最近熱門地點</title>
  <link rel="stylesheet" href="./index.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header class="hero">
      <div><p class="eyebrow"><span class="brand-mark" aria-hidden="true">◈</span> eBird 台灣觀鳥紀錄</p>
      <h1>最近熱門地點</h1><p class="intro">看看最近大家都去哪裡賞鳥。</p></div>
      <span class="update-badge"><span aria-hidden="true">●</span> 每日 06:00 更新</span>
    </header>
    <section class="filter-panel" aria-label="篩選資料">
      <form id="filters"><label>最後日期 <select id="date" name="date"></select></label><label>天數 <input id="days" name="days" type="number" min="1" max="31" value="4"></label><label class="region-select">地區 <select id="region" name="location"></select></label></form>
      <nav id="regions" aria-label="選擇縣市"></nav>
    </section>
    <section class="results-panel" aria-label="地點紀錄">
      <div class="results-heading"><div><h2><span id="region-title">台灣</span><span class="heading-divider">/</span>熱門地點</h2><p id="summary"></p></div>
        <nav class="table-actions" aria-label="展開控制"><button id="expand">全部展開</button><button id="collapse">全部收合</button></nav>
      </div>
      <p id="coverage" class="coverage" role="status" hidden></p>
      <p id="score-info" class="score-info"></p>
      <div id="results"></div>
      <div class="status-bar"><p id="status" role="status" aria-live="polite">載入中…</p><button id="retry" hidden>重試</button></div>
    </section>
    <footer><p>當日熱度：同行組為 1 + 0.5 ×（人數 − 1），平均分配給各人，同人同地同日只取最高一次。<br>人數以鳥友顯示名稱識別。紀錄數仍計入各人清單；合併僅減少顯示列。曲線代表到訪熱度，不代表特殊鳥種一定仍在。</p>
      <p><a id="source" href="https://ebird.org/region/TW/recent-checklists">eBird 最新紀錄</a><a href="https://github.com/ChrisTorng/eBirdRecentHotspot">GitHub 原始碼</a></p></footer>
  </main>
</body>
</html>
