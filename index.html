<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eBird 最近熱門地點</title>
  <link rel="stylesheet" href="./index.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <h1>eBird 最近熱門地點</h1>
    <p>依各地區最近 200 筆公開清單彙整，並非當日完整調查或鳥種聯集。每日台灣時間 06:00 更新。</p>
    <form id="filters"><label>資料日期 <select id="date" name="date"></select></label> <label>地區 <select id="region" name="location"></select></label></form>
    <p id="status" role="status" aria-live="polite">載入中…</p>
    <button id="retry" hidden>重試</button>
    <nav aria-label="展開控制"><button id="expand">全部展開</button> <button id="collapse">全部收合</button></nav>
    <section id="results" aria-label="地點紀錄"></section>
    <p><a id="source" href="https://ebird.org/region/TW/recent-checklists">eBird 最新紀錄</a> · <a href="https://github.com/ChrisTorng/eBirdRecentHotspot">GitHub 原始碼</a></p>
  </main>
</body>
</html>
